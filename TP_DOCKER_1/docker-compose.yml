version: "3.9"
services:
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "super-secret-password"
    volumes:
      - dbData:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    restart: always
    ports:
      - 80:80
volumes:
  dbData: