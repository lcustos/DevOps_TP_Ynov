name: Node.JS
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      working-directory: TP_DOCKER_2/src

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
        working-directory: ${{env.working-directory}}
      - run: npm test
        working-directory: ${{env.working-directory}}