name: Node.JS
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Use Node.JS
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

